services:
  gateway:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_FILE: /data/session.json
      PORT: "8080"
      NTFY_TOKEN_FILE: /run/secrets/ntfy_publish_token
      RING_TOKEN_FILE: /run/secrets/ring_token
    secrets: [ring_token, ntfy_publish_token]
    volumes: ["alexa-session:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
  ntfy:
    build:
      context: .
      dockerfile: Dockerfile.ntfy
    profiles: [notifications]
    init: true
    restart: unless-stopped
    volumes:
      - "ntfy-data:/var/lib/ntfy"
      - "./secrets/ntfy/server.yml:/etc/ntfy/server.yml:ro"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 3s
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    depends_on: [gateway]
  login:
    build: .
    profiles: [setup]
    init: true
    command: [node, src/login.js]
    environment:
      SESSION_FILE: /data/session.json
      LOGIN_BIND: 0.0.0.0
    ports: ["127.0.0.1:3456:3456"]
    volumes: ["alexa-session:/data"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
secrets:
  ring_token:
    file: ./secrets/ring_token
  ntfy_publish_token:
    file: ./secrets/ntfy_publish_token
  tunnel_token:
    file: ./secrets/tunnel_token
volumes:
  alexa-session:
  ntfy-data:
