name: Gateway checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upstream login regression tests
        run: node node_modules/alexa-cookie2/test/run-tests.js
      - name: Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          node scripts/token.js > secrets/ring_token
          touch secrets/tunnel_token
          docker compose config --quiet
          docker compose --profile tunnel --profile setup config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - name: Build gateway image
        run: docker compose build gateway
